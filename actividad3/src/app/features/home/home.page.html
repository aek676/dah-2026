<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Blank </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Coordinates</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-item>Latitude: {{ latitude }}</ion-item>
      <ion-title>Longitude: {{ longitude }}</ion-title>
      <ion-title>Accuracy: {{ accuracy }}</ion-title>
    </ion-card-content>
  </ion-card>
</ion-content>
