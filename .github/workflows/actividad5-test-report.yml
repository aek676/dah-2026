name: "Actividad5 Test Report"

on:
  workflow_run:
    workflows: ["Actividad 5 CI"]
    types: [completed]

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download Test Results
        uses: actions/download-artifact@v4
        with:
          name: test-results

      - name: Test Report
        uses: dorny/test-reporter@v3
        with:
          name: Karma Tests
          path: "."
          reporter: java-junit
          json: true

      - name: Download ESLint Results
        uses: actions/download-artifact@v4
        with:
          name: eslint-results

      - name: Annotate Code Linting Results
        uses: ataylorme/eslint-annotate-action@v4
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          report-json: "eslint-result.json"