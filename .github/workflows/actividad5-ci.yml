name: Actividad 5 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: actividad5

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: actividad5/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Linting
        run: npm run lint -- --format json --output-file coverage/eslint-result.json
        continue-on-error: true

      - name: Upload ESLint Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-results
          path: actividad5/coverage/eslint-result.json
          retention-days: 1

      - name: Test
        run: npm run test -- --watch=false --browsers=FirefoxHeadless

      - name: Build
        run: npm run build -- --base-href /dah-2026/

      - name: Fix SPA Routing for GitHub Pages
        run: cp www/index.html www/404.html

      - name: Upload Artifacts (Build)
        uses: actions/upload-artifact@v4
        with:
          name: www
          path: actividad5/www/
          retention-days: 1

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: actividad5/coverage/test-results.xml
          retention-days: 1

      - name: Install Ionic CLI
        run: npm install -D @ionic/cli

      - name: E2E Tests (Cypress)
        uses: cypress-io/github-action@v6
        with:
          working-directory: actividad5
          start: npx ionic serve
          wait-on: "http://localhost:8100"
          browser: chrome

      - name: Upload Cypress Screenshots/Videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            actividad5/cypress/screenshots
            actividad5/cypress/videos
          retention-days: 1

  reporting:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Download Test Results
        uses: actions/download-artifact@v4
        with:
          name: test-results

      - name: Test Report
        uses: dorny/test-reporter@v3
        with:
          name: Karma Tests
          path: test-results.xml
          reporter: java-junit

      - name: Download ESLint Results
        uses: actions/download-artifact@v4
        with:
          name: eslint-results

      - name: Annotate Code Linting Results
        uses: ataylorme/eslint-annotate-action@v4
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          report-json: eslint-result.json
          fail-on_errors: false

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/actividad5-deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write