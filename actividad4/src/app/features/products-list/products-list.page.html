<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Productos en venta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    @for (product of productsService.allProducts(); track product.id) {
    <ion-item>
      <ion-thumbnail slot="start">
        <img [src]="product.imageUrl" alt="{{ product.name }}" />
      </ion-thumbnail>
      <ion-label>
        <h2>{{ product.name }}</h2>
        <p>{{ product.description }}</p>
      </ion-label>
    </ion-item>
    } @empty {
    <ion-item>No hay productos disponibles.</ion-item>
    }
  </ion-list>
</ion-content>
